<svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular dark background for visibility on all browser themes -->
  <circle cx="22" cy="22" r="22" fill="#08090C" />

  <!-- Outer ring in light Indigo -->
  <circle cx="22" cy="22" r="18" stroke="#818CF8" strokeWidth="2.2" />

  <!-- R — vertical stem -->
  <line x1="12" y1="12" x2="12" y2="32" stroke="#FFFFFF" strokeWidth="2.2" strokeLinecap="round" />

  <!-- R — top bar -->
  <line x1="12" y1="12" x2="26" y2="12" stroke="#FFFFFF" strokeWidth="2.2" strokeLinecap="round" />

  <!-- R — right side of bowl -->
  <line x1="26" y1="12" x2="24" y2="22" stroke="#FFFFFF" strokeWidth="2.2" strokeLinecap="round" />

  <!-- R — middle bar -->
  <line x1="12" y1="22" x2="24" y2="22" stroke="#FFFFFF" strokeWidth="2.2" strokeLinecap="round" />

  <!-- R — diagonal leg breaking boundary -->
  <line x1="24" y1="22" x2="38" y2="38" stroke="#818CF8" strokeWidth="2.2" strokeLinecap="round" />
</svg>
